<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>引擎设置</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #161922;
        color: #e8edf7;
        padding: 20px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #8b93a7; font-size: 13px; line-height: 1.5; }
      label { display: block; margin: 14px 0 6px; font-size: 13px; color: #8b93a7; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        background: #101218;
        border: 1px solid rgba(255,255,255,0.1);
        color: inherit;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      button {
        margin-top: 18px;
        background: #4d93f8;
        color: #071018;
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .ghost { background: #1c2130; color: #e8edf7; margin-top: 0; }
      details { margin-top: 18px; color: #8b93a7; font-size: 13px; }
      details summary { cursor: pointer; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>引擎设置</h1>
    <p>
      日常使用不用改这里。桌面软件会自动从 npm 安装官方
      <code>@deepseek-ai/dsh</code>。中文系统首次启动会默认用国内镜像。
    </p>
    <p>当前工作区：<code id="workspace"></code></p>
    <label><input id="auto" type="checkbox" /> 启动时自动检查并更新 Harness</label>
    <label>npm 源</label>
    <div class="row">
      <button class="ghost" id="official" type="button">官方 npm</button>
      <button class="ghost" id="china" type="button">国内镜像</button>
    </div>
    <input id="registry" style="margin-top:8px" />
    <details>
      <summary>高级选项</summary>
      <label>更新通道</label>
      <select id="channel">
        <option value="latest">latest（稳定）</option>
        <option value="next">next（预览）</option>
      </select>
      <label>本地已构建的 harness 目录（一般不用填）</label>
      <div class="row">
        <input id="local" placeholder="/path/to/deepseek-harness" />
        <button class="ghost" id="pick" type="button">浏览</button>
      </div>
    </details>
    <button id="save" type="button">保存并重启引擎</button>
    <script>
      const $ = (id) => document.getElementById(id);
      const OFFICIAL = "https://registry.npmjs.org";
      const CHINA = "https://registry.npmmirror.com";
      window.desktop.getSettings().then((s) => {
        $("channel").value = s.channel === "next" ? "next" : "latest";
        $("auto").checked = s.autoUpdateHarness;
        $("registry").value = s.registry;
        $("local").value = s.localHarnessDir;
        $("workspace").textContent = s.workspaceDir || "（首次启动后自动使用家目录下的 DeepSeek 文件夹）";
      });
      $("official").onclick = () => { $("registry").value = OFFICIAL; };
      $("china").onclick = () => { $("registry").value = CHINA; };
      $("registry").oninput = () => { $("registry").dataset.touched = "1"; };
      $("pick").onclick = async () => {
        const dir = await window.desktop.pickDir();
        if (dir) $("local").value = dir;
      };
      $("save").onclick = async () => {
        const current = await window.desktop.getSettings();
        const registry = $("registry").value.trim() || current.registry;
        await window.desktop.saveSettings({
          ...current,
          channel: $("channel").value,
          autoUpdateHarness: $("auto").checked,
          registry,
          registrySource: registry === current.registry ? current.registrySource : "user",
          localHarnessDir: $("local").value,
        });
        window.desktop.apply();
        window.close();
      };
    </script>
  </body>
</html>
