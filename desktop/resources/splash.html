<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #101218;
        color: #e8edf7;
        display: flex;
        flex-direction: column;
        padding: 28px 28px 20px;
      }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.03em; }
      p { margin: 0; color: #8b93a7; font-size: 13px; }
      .status { margin: 22px 0 10px; font-size: 14px; color: #7eb0ff; }
      .log {
        flex: 1;
        background: #0c0e14;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 10px 12px;
        overflow: auto;
        font: 12px/1.45 ui-monospace, monospace;
        color: #b7c0d4;
        white-space: pre-wrap;
      }
      .bar { height: 4px; background: #1c2130; border-radius: 99px; margin-top: 12px; overflow: hidden; }
      .bar span { display: block; height: 100%; width: 40%; background: #4d93f8; animation: slide 1.2s infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
    </style>
  </head>
  <body>
    <h1>DeepSeek</h1>
    <p>Desktop shell · engine is DeepSeek Harness (`dsh`), updated independently from npm.</p>
    <div class="status" id="status">Starting…</div>
    <div class="log" id="log"></div>
    <div class="bar"><span></span></div>
    <script>
      const status = document.getElementById("status");
      const log = document.getElementById("log");
      window.desktop.onStatus((payload) => {
        status.textContent = payload.text;
        if (payload.phase === "error") status.style.color = "#f07178";
      });
      window.desktop.onLog((line) => {
        log.textContent += line + "\n";
        log.scrollTop = log.scrollHeight;
      });
    </script>
  </body>
</html>
