<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      html.preview, html.preview body { background: #0c0e14; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .sheet {
        width: min(440px, 100%);
        position: relative;
        border-radius: var(--radius);
        padding: 26px 26px 20px;
        background:
          radial-gradient(420px 180px at 0% 0%, rgba(77, 147, 248, 0.18), transparent 58%),
          radial-gradient(280px 140px at 100% 0%, rgba(124, 92, 255, 0.1), transparent 52%),
          var(--card);
        border: 1px solid var(--line);
        box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        line-height: 32px;
      }
      .close:hover { background: var(--card-2); color: var(--text); }
      .icon-wrap {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--accent-dim);
        border: 1px solid rgba(77, 147, 248, 0.22);
        margin-bottom: 16px;
        overflow: hidden;
      }
      .icon-wrap img { width: 48px; height: 48px; }
      .icon-wrap.error { background: rgba(240, 113, 120, 0.12); border-color: rgba(240, 113, 120, 0.28); color: var(--danger); }
      .icon-wrap.success { background: rgba(127, 217, 154, 0.12); border-color: rgba(127, 217, 154, 0.28); color: var(--ok); }
      .icon-wrap svg { width: 22px; height: 22px; }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: -0.03em;
        line-height: 1.3;
        padding-right: 28px;
      }
      .message {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.65;
      }
      .detail {
        margin: 10px 0 0;
        color: #a7b0c4;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .versions {
        display: none;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        margin: 18px 0 4px;
      }
      .sheet.update .versions,
      .sheet.has-versions .versions { display: grid; }
      .ver {
        background: var(--card-2);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        min-height: 64px;
      }
      .ver span {
        display: block;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .ver strong {
        font-size: 14px;
        font-weight: 650;
        word-break: break-all;
      }
      .ver.latest {
        border-color: rgba(77, 147, 248, 0.35);
        box-shadow: inset 0 0 0 1px rgba(77, 147, 248, 0.08);
      }
      .arrow { color: var(--accent); font-size: 18px; }
      .source {
        display: none;
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .sheet.update .source,
      .sheet.about .source,
      .sheet.success .source { display: block; }
      .source code {
        color: #c5d0e6;
        font-size: 12px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        appearance: none;
        border: 0;
        min-height: 40px;
        padding: 0 16px;
        border-radius: var(--radius-sm);
        font-size: 13.5px;
        font-weight: 600;
      }
      .btn.primary {
        background: var(--accent);
        color: #071018;
        box-shadow: 0 8px 20px rgba(77, 147, 248, 0.28);
      }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }
      .btn.ghost:hover { background: var(--card-2); }
      .btn.danger {
        background: var(--danger);
        color: #1a0c0d;
      }
    </style>
  </head>
  <body>
    <div class="sheet" id="sheet">
      <button class="close" id="close" type="button" aria-label="关闭">×</button>
      <div class="icon-wrap" id="icon"></div>
      <h1 id="title"></h1>
      <p class="message" id="message"></p>
      <p class="detail" id="detail" hidden></p>
      <div class="versions">
        <div class="ver">
          <span>当前</span>
          <strong id="current">—</strong>
        </div>
        <div class="arrow" aria-hidden="true">→</div>
        <div class="ver latest">
          <span>最新</span>
          <strong id="latest">—</strong>
        </div>
      </div>
      <p class="source" id="source"></p>
      <div class="actions" id="actions"></div>
    </div>
    <script>
      const svg = {
        update: '<svg viewBox="0 0 24 24" fill="none" stroke="#4d93f8" stroke-width="1.8"><path d="M12 5v10M8 9l4-4 4 4"/><path d="M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="#4d93f8" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8h.01"/></svg>',
        about: "",
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="#f07178" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></svg>',
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="#7fd99a" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5 11 15l4.5-5"/></svg>',
      };
      const PREVIEW = {
        update: {
          requestId: "preview",
          kind: "update",
          title: "发现新的 DeepSeek Harness",
          message: "官方引擎已发布新版本。更新后会自动重启，即可接着用。不会重新克隆 GitHub 源码。",
          currentVersion: "0.1.0-rc.6",
          latestVersion: "0.1.0-rc.7",
          source: "npm @deepseek-ai/dsh@latest",
          buttons: [
            { id: "later", label: "以后再说", variant: "ghost" },
            { id: "update", label: "更新并重启", variant: "primary" },
          ],
          defaultId: "update",
          cancelId: "later",
        },
        about: {
          requestId: "preview",
          kind: "about",
          title: "DeepSeek Harness",
          message: "薄薄一层桌面壳，引擎始终是官方 @deepseek-ai/dsh。",
          extra: "桌面版 0.1.6",
          currentVersion: "0.1.0-rc.6",
          source: "工作区 ~/DeepSeek",
          buttons: [{ id: "ok", label: "好的", variant: "primary" }],
          defaultId: "ok",
          cancelId: "ok",
        },
        error: {
          requestId: "preview",
          kind: "error",
          title: "检查更新失败",
          message: "暂时连不上 npm。请检查网络后再试。",
          detail: "npm registry 503 for https://registry.npmmirror.com/@deepseek-ai/dsh/latest",
          buttons: [{ id: "ok", label: "知道了", variant: "primary" }],
          defaultId: "ok",
          cancelId: "ok",
        },
      };

      let payload = null;

      function render(next) {
        payload = next;
        const sheet = document.getElementById("sheet");
        sheet.className = "sheet " + (next.kind || "info");
        if (next.currentVersion && next.latestVersion) sheet.classList.add("has-versions");
        document.getElementById("title").textContent = next.title || "";
        document.getElementById("message").textContent = next.message || "";
        const detail = document.getElementById("detail");
        if (next.detail) {
          detail.hidden = false;
          detail.textContent = next.detail;
        } else if (next.extra) {
          detail.hidden = false;
          detail.textContent = next.extra;
        } else {
          detail.hidden = true;
          detail.textContent = "";
        }
        document.getElementById("current").textContent = next.currentVersion || "—";
        document.getElementById("latest").textContent = next.latestVersion || "—";
        const source = document.getElementById("source");
        source.innerHTML = next.source ? next.source.replace(/`([^`]+)`/g, "<code>$1</code>") : "";
        const icon = document.getElementById("icon");
        icon.className = "icon-wrap " + (next.kind || "");
        if (next.kind === "about" || next.kind === "update") {
          icon.innerHTML = '<img src="./icon.png" alt="" />';
        } else {
          icon.innerHTML = svg[next.kind] || svg.info;
        }
        const actions = document.getElementById("actions");
        actions.innerHTML = "";
        (next.buttons || []).forEach((button) => {
          const el = document.createElement("button");
          el.type = "button";
          el.className = "btn " + (button.variant || "ghost");
          el.textContent = button.label;
          el.addEventListener("click", () => respond(button.id));
          actions.appendChild(el);
        });
      }

      function respond(id) {
        if (!payload) return;
        if (window.desktop && window.desktop.respondDialog) {
          window.desktop.respondDialog(payload.requestId, id);
        }
      }

      document.getElementById("close").addEventListener("click", () => {
        respond((payload && payload.cancelId) || "cancel");
      });
      document.addEventListener("keydown", (event) => {
        if (!payload) return;
        if (event.key === "Escape") respond(payload.cancelId || "cancel");
        if (event.key === "Enter") respond(payload.defaultId || payload.cancelId || "ok");
      });

      const preview = new URLSearchParams(location.search).get("preview");
      if (window.desktop && window.desktop.onDialogOpen) {
        window.desktop.onDialogOpen(render);
      } else {
        document.documentElement.classList.add("preview");
        render(PREVIEW[preview] || PREVIEW.update);
      }
    </script>
  </body>
</html>
