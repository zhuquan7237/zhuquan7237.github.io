name: Update download manifest

# Manual repair tool only. The automatic manifest update now lives at the end of
# desktop.yml's publish-release job, where it cannot race the asset uploads:
# a "release published" workflow fired when the release object was created,
# before softprops finished uploading, and 0.1.18 shipped a latest.json that
# listed 7 of 17 assets with size 0. Use workflow_dispatch here to regenerate
# the manifest by hand if it ever drifts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write dl/latest.json from the latest desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time

          def get_release():
              raw = subprocess.check_output(
                  ["gh", "api", "repos/zhuquan7237/zhuquan7237.github.io/releases/latest"], text=True)
              return json.loads(raw)

          # Assets uploaded seconds ago can still report size 0; wait until the
          # list is complete (count stable) and every size is non-zero.
          rel = get_release()
          last_count = -1
          deadline = time.time() + 900
          while time.time() < deadline:
              assets = rel.get("assets") or []
              sizes_ok = bool(assets) and all(int(a.get("size") or 0) > 0 for a in assets)
              if sizes_ok and len(assets) == last_count:
                  break
              last_count = len(assets)
              print(f"waiting for assets to settle (have {len(assets)})")
              time.sleep(15)
              rel = get_release()

          version = (rel.get("tag_name") or "").replace("desktop-v", "").lstrip("v")
          assets = []
          for asset in rel.get("assets") or []:
              name = asset.get("name") or ""
              if not name.startswith("DeepSeek-"):
                  continue
              assets.append({
                  "name": name,
                  "url": f"https://dsh.zhuquan.xyz/dl/{name}",
                  "github": asset.get("browser_download_url"),
                  "size": int(asset.get("size") or 0),
              })
          payload = {
              "version": version,
              "tag": rel.get("tag_name") or "",
              "htmlUrl": "https://dsh.zhuquan.xyz/dl/",
              "notes": (rel.get("body") or "").strip().split("\n", 1)[0],
              "assets": assets,
          }
          os.makedirs("dl", exist_ok=True)
          with open("dl/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(version, len(assets))
          PY
      - name: Commit manifest
        run: |
          git add dl/latest.json
          git diff --cached --quiet && echo "no change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dl/latest.json for the current desktop release."
          git push origin HEAD:main
