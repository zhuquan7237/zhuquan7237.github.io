name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.sh
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # dl/latest.json must always be committed on main, even when the build
          # was triggered from a cursor/** branch.
          ref: main
      - name: Read desktop version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: DeepSeek Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            请用 ${{ steps.version.outputs.version }}。不要用更早的版本。

            **0.2.4 → 0.2.5**
            - 修好模型列表同步（此前从未生效）：同步读取的配置结构与引擎实际使用的不一致、请求的接口路径也不对。现在按引擎真实结构（llm-pi-ai.providers）工作，启动时在引擎启动前自动拉取各接口的实时模型列表（Anthropic 风格 `/v1/models` 优先、OpenAI 风格 `/models` 兜底、两种鉴权自适应），与引擎内置模型目录合并：目录已有的模型保留引擎默认元数据（价格 / 上下文窗口 / 协议），新模型自动补齐协议与接口地址；只增不删，手工配置的模型不受影响
            - 设置页「模型与接口」改为真实读取引擎配置，不再显示内置演示假数据；手动同步完成后提示重启生效

            **0.2.3 → 0.2.4**
            - 修好引擎启动报 `ERR_MODULE_NOT_FOUND`：dsh 运行时要交叉引用约 100 个 `@deepseek-ai/*` 包，它们互相只声明为 peer 依赖，`--legacy-peer-deps` 安装会漏掉其中未被普通依赖覆盖的部分（0.2.1 装的引擎缺 19 个，0.2.2/0.2.3 的全新安装同样缺）。现在安装后与每次启动前都会扫描依赖树、按引擎版本锁定自动补齐缺失的 peer，旧引擎无需手动删除重装
            - 开发机 `npm install` 后自动校验并修复 Electron 二进制：Node 24 上 electron 自带的解压链会静默卡死、留下不完整的安装，现在 postinstall 会检测并用系统工具从本地缓存还原

            **0.2.0 → 0.2.1**
            - 修复官方引擎 Harness 更新拉取卡住问题：npm 安装添加 `--legacy-peer-deps`，跳过 70+ 个互锁预发布子包的 peer 依赖深度组合回溯，解决更新时 CPU/内存暴涨与下载超时问题

            **0.1.19 → 0.2.0**
            - 新增「视觉辅助模型」：主模型不支持识图时，先把图片交给 OpenAI 兼容的视觉模型（Qwen-VL / GLM-4V / gpt-4o / Ollama 等）转成文字描述；主模型支持识图时原图直通，识别能力由引擎自动判断。引擎设置里填接口地址、Key、模型名即可
            - 新增「自定义联网搜索」：web_search 工具可切换为 Tavily（自己的 API Key，模型看到的工具与结果卡片不变），也可一键切回 DeepSeek 官方搜索
            - 两个功能都以随安装包内置的官方机制引擎插件实现（ctx.web provider 注册 + agent/pre-step 改写），不改引擎源码；API Key 只存本机、经环境变量传给引擎，不落明文配置
            - 已通过真实引擎启动冒烟验证插件加载链路；测试套件扩至 121 例

            **0.1.18 → 0.1.19**
            - dl/latest.json 改为在安装包全部上传完成后生成：0.1.18 的清单只记到 7/17 个文件且大小为 0。发布 tag 与 Release 名自动跟随 desktop/package.json
            - 首次启动下载 Node 时连接或传输卡住会自动中止并换镜像，不再无限停在「正在下载 Node.js」；报错会按网络问题给出中文提示
            - 新增 Linux rpm 包（Fedora / openSUSE，x86_64 与 aarch64），下载页与下载域名同步支持
            - 测试套件在 Windows 开发机上也能通过（路径分隔符与 POSIX 专属用例）

            **0.1.17 → 0.1.18**
            - 修好零配置 Linux 首次安装：不再依赖系统 xz；失败会清掉半成品 Node 包；快捷方式只在主界面打开后创建；报错改成中文下一步（缺 make/g++、没网、AppImage 缺 libfuse2）。启动页增加「重试」
            - 下载页补上 Linux arm64 和 AppImage。AppImage 另附无 FUSE 启动脚本。Windows 解压 Node 不再依赖 PowerShell Expand-Archive；macOS 同样改用 .tar.gz

            **0.1.16 → 0.1.17**
            - 启动加载界面改成 Windows 11 Fluent：无边框窗口、标题栏关闭按钮、圆角卡片、次要「退出」按钮。Windows 11 上用 mica 材质

            **0.1.15 → 0.1.16**
            - 安装包改从本域名下载：https://dsh.zhuquan.xyz/dl/ 。软件内更新先走域名，失败再回退 GitHub。安装包不放进 Pages 仓库（超过 100 MB），由 Cloudflare Worker 从 GitHub Release 回源并在边缘缓存

            **0.1.14 → 0.1.15**
            - 修好 Windows「检查桌面版更新」进度一直停在 0%：旧版按 10% 才刷新一次，188 MB 安装包会长时间显示 0%；启动页关掉后也看不到进度。0.1.15 按 1% / 1 MB 刷新，重新打开启动页，并用 Chromium 网络栈走系统代理。卡住超过 45 秒会提示用浏览器打开 https://dsh.zhuquan.xyz/

            **0.1.13 → 0.1.14**
            - 修好升级后默认皮肤消失、只能从 GitHub 再拉一次：安装包里的皮肤在 app.asar 里，Electron 能读到但复制不出来。0.1.14 改为使用 asar.unpacked / extraResources，不再走 GitHub

            **0.1.12 → 0.1.13**
            - 修好便携版 / AppImage 首次打开后桌面快捷方式指向临时解压目录，关掉软件后失效。快捷方式改为指向便携版 exe / AppImage 本身；旧的失效快捷方式下次从安装包打开会自动修好

            **0.1.11 → 0.1.12**
            - 默认皮肤「深海女仆工坊」打进安装包，不再从 GitHub 下载（国内网络拉不下皮肤时也能用）
            - 升级后尽量继承旧版 API 密钥和引擎配置：当前 `%AppData%\DeepSeek` / `~/.config/DeepSeek`，以及更早的 `深度求索`、`DeepSeek Harness`、官方 `~/.dsh`

            **0.1.10 → 0.1.11**
            - 修好从旧版「检查桌面版更新」升到 0.1.10 后 dsh 退出：`cordis.patch.yml` 必须是顶层 YAML 数组，空补丁写 `[]`，启动时自动修复坏文件

            **0.1.9 → 0.1.10**
            - 对话窗口右上角皮肤中心：圆形按钮弹出皮肤列表，可快速切换，也可导入新皮肤
            - 默认皮肤是 [Small-tailqwq/dsh-deep-whale](https://github.com/Small-tailqwq/dsh-deep-whale) 的「深海女仆工坊」，CC BY-NC-SA 4.0，禁止商用。署名链：上善 → ZipZipPipe → Small-tailqwq
            - 可在引擎设置里关闭皮肤中心，恢复官方界面

            **0.1.8 → 0.1.9**
            - macOS ad-hoc 签名 + `Open-DeepSeek.command`
            - 桌面版会查 GitHub Release 更新

            **直接下载（不用登录）**
            - Windows 安装包：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-win.exe
            - Linux x64（推荐 tar.gz）：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            - Linux x64 deb：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-amd64.deb
            - Linux x64 rpm：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-x86_64.rpm
            - Linux arm64 tar.gz：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            - Linux arm64 deb：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.deb
            - Linux arm64 rpm：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-aarch64.rpm
            - macOS Apple Silicon：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-mac-arm64.dmg
            - macOS Intel：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-mac-x64.dmg

            首次启动需要联网 1–3 分钟（下载 Node 和官方 dsh）。默认皮肤已内置。之后菜单可检查桌面版和 Harness 更新。

            **Linux:** 优先 `.tar.gz` 或 `.deb`。AppImage 在 Ubuntu 24.04 常缺 libfuse2。
            **Windows:** 安装包会创建桌面和开始菜单快捷方式。便携版快捷方式指向该 exe 本身，关掉后仍然有效。未签名时 SmartScreen 选「更多信息 → 仍要运行」。
            **macOS:** 把 App 拖到「应用程序」。若提示已损坏，终端运行 `xattr -cr /Applications/DeepSeek.app`。DMG 里有 `Read-Me-First.txt` 和 `Open-DeepSeek.command`。说明：https://dsh.zhuquan.xyz/mac.html

            | File | Platform |
            | --- | --- |
            | `DeepSeek-${{ steps.version.outputs.version }}-win.exe` | Windows installer |
            | `DeepSeek-${{ steps.version.outputs.version }}-win-x64.exe` / `*-win-arm64.exe` | Windows portable |
            | `DeepSeek-${{ steps.version.outputs.version }}-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-${{ steps.version.outputs.version }}-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-x64.tar.gz` / `*-linux-amd64.deb` / `*-linux-x86_64.rpm` | Linux x64 |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.tar.gz` / `*-linux-arm64.deb` / `*-linux-aarch64.rpm` | Linux arm64 |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-*.AppImage` / `*-no-fuse.sh` | AppImage（需 libfuse2，或用脚本） |
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.rpm
            installers/*.tar.gz
            installers/*.sh
      # softprops has finished every asset upload by this point, so the manifest
      # cannot race half-uploaded assets the way a separate "release published"
      # workflow did (0.1.18 shipped a latest.json with 7 of 17 assets, size 0).
      - name: Write dl/latest.json from the published release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          version = os.environ["VERSION"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/zhuquan7237/zhuquan7237.github.io/releases/tags/desktop-v{version}"],
              text=True,
          )
          rel = json.loads(raw)
          assets = []
          for asset in rel.get("assets") or []:
              name = asset.get("name") or ""
              if not name.startswith("DeepSeek-"):
                  continue
              assets.append({
                  "name": name,
                  "url": f"https://dsh.zhuquan.xyz/dl/{name}",
                  "github": asset.get("browser_download_url"),
                  "size": int(asset.get("size") or 0),
              })
          payload = {
              "version": version,
              "tag": rel.get("tag_name") or f"desktop-v{version}",
              "htmlUrl": "https://dsh.zhuquan.xyz/dl/",
              "notes": (rel.get("body") or "").strip().split("\n", 1)[0],
              "assets": assets,
          }
          os.makedirs("dl", exist_ok=True)
          with open("dl/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(version, len(assets), "assets")
          PY
      - name: Commit dl/latest.json
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add dl/latest.json
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dl/latest.json for desktop v${VERSION}."
          git push origin HEAD:main
