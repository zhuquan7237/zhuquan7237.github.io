name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.sh
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # dl/latest.json must always be committed on main, even when the build
          # was triggered from a cursor/** branch.
          ref: main
      - name: Read desktop version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # GitHub 平台对「更新已存在的 release」（update-a-release 端点）用 GITHUB_TOKEN
      # 会 403 Resource not accessible by integration（2025-01 起多个仓库复现的已知问题；
      # 新建 release 不受影响）。因此同版本重复推送时不再尝试重新发布——直接跳过，
      # 需要刷新资产就手动：gh release upload desktop-vX.Y.Z <file> --clobber
      - name: Skip publish when this version is already released
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "desktop-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "desktop-v$V 已发布过——本次仅构建检验，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish public GitHub Release
        if: steps.released.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: DeepSeek Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
      # body 会随版本增长，GitHub 对这里的表达式有 21000 字符上限；超过后整个
      # workflow 会被拒绝启动（报 Exceeded max expression length，run 里一个 job
      # 都不会出现）。只保留最近两版说明 + 下载信息，更早的说明留在各自 Release 里。
          body: |
            请用 ${{ steps.version.outputs.version }}。不要用更早的版本。

            **0.6.3 → 0.6.4**
            - **手机端「运行进度可见」（桥接 0.2.31）**：任务卡在“几百秒没动静”时，现在能一眼看出是真在跑还是卡住——运行条会实时显示「模型正在思考 · 已 3.2 万字」「模型正在输出 · 已 1240 字」这类计数；上游断线自动重试时直接显示「连接中断 · 第 2/5 次重试（上次尝试 4 分 28 秒）」；长时间没有新输出也会把等待时长摆出来。
            - 兼容性：新增的只是计数脉冲与状态行，不含任何正文内容，不影响「回复完成后一次性显示」的既有节奏。

            **0.6.2 → 0.6.3**
            - 回退：手机端「实时逐字输出」下线——逐字增量会造成屏幕闪烁，恢复为「生成完成后一次性显示」，稳定不闪（含旧版 App 在内所有客户端自动回到旧行为）。
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.rpm
            installers/*.tar.gz
            installers/*.sh
      # softprops has finished every asset upload by this point, so the manifest
      # cannot race half-uploaded assets the way a separate "release published"
      # workflow did (0.1.18 shipped a latest.json with 7 of 17 assets, size 0).
      - name: Write dl/latest.json from the published release
        if: github.ref == 'refs/heads/main' && steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          version = os.environ["VERSION"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/zhuquan7237/zhuquan7237.github.io/releases/tags/desktop-v{version}"],
              text=True,
          )
          rel = json.loads(raw)
          assets = []
          for asset in rel.get("assets") or []:
              name = asset.get("name") or ""
              if not name.startswith("DeepSeek-"):
                  continue
              assets.append({
                  "name": name,
                  "url": f"https://dsh.zhuquan.xyz/dl/{name}",
                  "github": asset.get("browser_download_url"),
                  "size": int(asset.get("size") or 0),
              })
          payload = {
              "version": version,
              "tag": rel.get("tag_name") or f"desktop-v{version}",
              "htmlUrl": "https://dsh.zhuquan.xyz/dl/",
              "notes": (rel.get("body") or "").strip().split("\n", 1)[0],
              "assets": assets,
          }
          os.makedirs("dl", exist_ok=True)
          with open("dl/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(version, len(assets), "assets")
          PY
      - name: Commit dl/latest.json
        if: github.ref == 'refs/heads/main' && steps.released.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add dl/latest.json
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dl/latest.json for desktop v${VERSION}."
          git push origin HEAD:main
