name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - name: Pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.9
          name: DeepSeek Desktop 0.1.9
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            请用 0.1.9。不要用 0.1.0–0.1.8。

            **0.1.8 → 0.1.9**
            - macOS：安装包改为 ad-hoc 签名。以前没签名时，Sequoia 会把隔离的 App 显示成「文件已损坏」（不是下坏了）
            - DMG 里带 `Open-DeepSeek.command`，提示已损坏时双击它即可清除隔离
            - 桌面版会查 GitHub Release：启动后询问，或用菜单 **Harness → 检查桌面版更新**。不用 git pull

            **0.1.7 → 0.1.8**
            - 便携版快捷方式不再每次启动都重写
            - 图标换成官网鲸鱼

            **直接下载（不用登录）**
            - Windows 安装包：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.9/DeepSeek-0.1.9-win.exe
            - Linux x64（推荐 tar.gz）：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.9/DeepSeek-0.1.9-linux-x64.tar.gz
            - Linux x64 deb：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.9/DeepSeek-0.1.9-linux-amd64.deb
            - macOS Apple Silicon：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.9/DeepSeek-0.1.9-mac-arm64.dmg
            - macOS Intel：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.9/DeepSeek-0.1.9-mac-x64.dmg

            首次启动需要联网 1–3 分钟（下载 Node 和官方 dsh）。之后菜单可检查桌面版和 Harness 更新。

            **Linux:** 优先 `.tar.gz` 或 `.deb`。AppImage 在 Ubuntu 24.04 常缺 libfuse2。
            **Windows:** 安装包会创建桌面和开始菜单快捷方式。未签名时 SmartScreen 选「更多信息 → 仍要运行」。
            **macOS:** 把 App 拖到「应用程序」。若提示已损坏，双击 DMG 里的 `Open-DeepSeek.command`，或系统设置 → 隐私与安全性 → 仍要打开。

            | File | Platform |
            | --- | --- |
            | `DeepSeek-0.1.9-win.exe` | Windows installer |
            | `DeepSeek-0.1.9-win-x64.exe` / `*-win-arm64.exe` | Windows portable |
            | `DeepSeek-0.1.9-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-0.1.9-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-0.1.9-linux-x64.tar.gz` / `*-linux-amd64.deb` | Linux x64 |
            | `DeepSeek-0.1.9-linux-arm64.tar.gz` / `*-linux-arm64.deb` | Linux arm64 |
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.tar.gz
