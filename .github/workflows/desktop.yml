name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.sh
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # dl/latest.json must always be committed on main, even when the build
          # was triggered from a cursor/** branch.
          ref: main
      - name: Read desktop version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: DeepSeek Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            请用 ${{ steps.version.outputs.version }}。不要用更早的版本。

            **0.5.9 → 0.5.10**
            - **修一个会让设置"看起来丢数据"的保存 bug**：设置窗口里那些**只写不显示**的密钥（Tavily / 视觉 API Key），保存时会被写成空字符串 —— 用户打开设置、什么都没改点一下保存，密钥就没了（0.5.6 之后有用户这样丢掉过 Tavily Key）。现在页面记住主进程给的原值，**只有你在输入框里真的打过字才会覆盖**；并且设置没加载完时保存按钮禁用、读不到设置会明确提示并禁止保存（以前会拿默认值覆盖真实配置）
            - 排查结论：所有内置插件的用户数据都写在 `dsh-home/` 下，插件升级（换目录）不会动它；升级后"设置不见了"来自设置页搬家和上面这个保存 bug，不是数据被删

            **0.5.6 → 0.5.9**
            - **手机端配对搬进桌面设置窗口**：通用页新增「手机端（配对与设备）」卡片 —— 配对码、剩余时间、**二维码**（手机 App 扫码即配）、已绑定设备列表（显示权限与最近活动，可一键解除）。以前配对码只在一个需要手输地址的本地页面里，桌面端等于没有配对入口
            - **「搜索引擎」页有了迁移**：以前在设置里填过 Tavily Key 的机器，升级后不会再用「未配置」把密钥藏起来 —— 引擎插件的状态检查现在和真正发请求走同一条密钥解析链（含外壳注入的 `DSH_TAVILY_API_KEY`），并且从未配置过的机器会按旧设置自动种一份引擎配置（旧的 Tavily 选择/密钥直接生效）
            - **修一个让手机端永远写不进配置的桥接 bug**：`PUT /mobile/models` 与 `POST /mobile/credentials` 漏读请求体，任何客户端（手机 App、网页版）保存模型或密钥都会被当成空列表拒绝；配对时勾选「允许在这台手机上改模型配置」后，手机现在能真正增删提供商与模型
            - 内置搜索插件与手机桥接插件的状态显示、错误提示一并修正：失败时说清是哪个引擎、发的是哪个地址

            **0.5.5 → 0.5.6**
            - **搜索改成「一个页面管完所有引擎」**：设置里新增「搜索引擎」页 —— 六张引擎卡（本机搜索池 / SearXNG / Tavily / Serper / 官方 DeepSeek / 自定义 JSON 接口），每张卡自己知道该发什么请求，填好预设不用手打地址，每张卡都有**「测试」按钮**：真发一次搜索，当场告诉你状态码、用时、命中几条、第一条标题；失败给中文原因加**实际请求的 URL**
            - **保存前拦错地址**：官方搜索那栏只接受 Anthropic 兼容基址。以前它静默接受任何合法 URL —— 你配置里那个 `https://google.serper.dev` 就是这样存进去的，然后每次搜索都以 HTTP 411 失败（实测），错误还是英文并让你自己去三级菜单找。现在这种地址会被直接标出来并提示改用对应引擎卡
            - **本机/内网引擎不再走代理**：代理套到 127.0.0.1 上会把「正在运行的实例」误报成「连不上」，实测本机池与 SearXNG 都因此失败过
            - 提供方从「二选一」变成「一条优先级链」：引擎按你排的顺序试，第一个成功就返回，全失败才报错，并把每个引擎各自的原因列出来（引擎本身没有优先级机制，多注册一个就会报 ambiguous，所以由插件自己路由）
            - 旧的两处配置（壳里那个只有官方/Tavily 的下拉、官方卡里的裸 Endpoint）已合并到这里；壳里存过的 Tavily Key 仍然有效，会自动沿用
            - 实测：本机搜索池 5 条 / 1.8 秒、SearXNG 20 条 / 1.4 秒；不需要 Key 的引擎开箱即用

            **0.5.4 → 0.5.5**
            - 修一个让 0.5.4 的插件改动**静默失效**的问题：外壳只在**版本号变化**时才把内置插件重装到用户目录，插件代码改了而版本号没改时，已经装过它的机器会继续跑旧代码，且没有任何提示。现在已经改成「版本号或内容任一变化就重装」，插件版本号同时提到 0.2.1，并补了回归测试
            - 也就是说：0.5.4 那套「改从项目域名取能力目录 + 修好模型归一化」的插件，在升级过 0.5.3 的机器上其实一直没生效（实测已装副本仍是旧代码、目录地址仍是公共目录）。装 0.5.5 后才会真正生效

            **0.5.3 → 0.5.4**
            - **能力目录改为每日云端自动构建**：仓库里多了一个定时工作流（每天 06:10 北京时间），合并 OpenRouter 与 models.dev 两个公共目录，产出统一的能力目录并发布到 `dsh.zhuquan.xyz/dl/capabilities.json` —— 不需要你的电脑开着，不需要任何密钥，产物在 Actions 里可查
            - **客户端改从项目域名取目录**：打开 dsh 时目录超过 24 小时就自动同步；取不到时改用公共目录兜底，再取不到才用内置快照，所以不会因为你的域名挂掉而退化。所有机器拿到的是同一份答案
            - 覆盖率实测（本机 516 个模型）：单用 OpenRouter 95.9%、单用 models.dev 82.9%、**合并 97.5%**；配合家族规则后「无法判定」从 8 个降到 **1 个**（只剩全新发布的 `hy3-x`，两个目录都还没有 —— 不猜）
            - 修两个判断 bug：①路由后缀 `:free` / `:batch` 没被剥离，同一个模型换个写法就认不出来 ②家族规则写成点号（`gpt-4.1`、`kimi-k2.7`），但规则匹配的是归一化后的 id（点号已变成横杠），等于从未生效，`kimi-k2.7`、`gpt-4.1`、`glm-4.5v` 这类模型因此被判未知或纯文本

            **0.5.2 → 0.5.3**
            - **模型能力自动识别**：新增「模型能力」设置页。填完 URL + API key、拉到模型列表之后，**软件自己判断**每个模型收不收图片、上下文多长、输出上限多少 —— 不用再一个个填
            - 三层来源、每一层都能溯源：①**上游** `/v1/models` 公布的元数据（实测 6 条路由里只有 wb2api 给出上下文/输出上限，clinepass 什么都不返回）②**跨厂商能力目录**：内置快照 + 每日自动从网络刷新，实测覆盖本机 516 个模型里的 **95%**（含 `architecture.input_modalities` 与 `context_length`）③**家族规则兜底**：生图模型（`gpt-image-*`）判纯文本、`codex-*` 判纯文本、`gemini-*-agent` 继承家族判视觉
            - 应用策略：**新模型/新字段自动写入；与已有值冲突的修正列进「待确认」清单**，你点应用才改。实测一键识别全部：516 个模型 → 自动写入 **507**，11 处修正留待确认
            - 每行显示来源徽标（上游 / 目录 / 推断 / 手动），可单独改上下文与输出上限；**手动值优先级最高，且之后不再被自动同步覆盖**
            - 界面重做：独立设置页 + 能力芯片 + 统计面板 + 待确认队列 + 筛选（支持图片 / 未知 / 手动改过），支持几百个模型的路由筛选
            - 修一个会让写入整体失败的 bug：能力目录给的模态里含 `file/audio/video`，而引擎的 schema 只接受 `text|image`，未收窄会导致整条写入被拒

            **0.5.1 → 0.5.2**
            - 新增「支持图片输入」开关：设置 → 模型 里每张 pi-ai provider 卡片下多出一块「支持图片输入」，逐模型勾选（带筛选框，454 个模型的路由也能用）。勾上之后引擎才会把图片真正发给该模型
            - 为什么需要它：带图片的消息进来时，引擎会先查该模型的 `input` 模态，没声明就抛 `MODEL_DOES_NOT_SUPPORT_IMAGES`，界面显示「当前模型不支持图片，请切换支持图片的模型」。而官方模型编辑界面只画 `contextWindow` / `maxTokens`，没有 `input` 这一项 —— 于是手写路由（任何私有网关）下所有模型都被当成纯文本，你根本没法从界面里声明
            - 实现只用官方两种正式扩展点：读走 `ctx.llm.listModels()`（引擎自己的模型注册表），UI 挂在官方专门给第三方留的键控插槽 `settings.models.provider-card`（key = `settingsNs`，内置/新增/手写三种卡片都覆盖），写走引擎自己的 `settings.mutate()` —— 因此校验、落盘、通知与其他设置完全同一条路径，不会把配置文件写坏
            - 顺带修正：桌面端面板的界面语言现在真的跟随设置里的语言（此前语言从未传进组件，永远显示中文）

            **0.5.0 → 0.5.1**
            - 修好桌面面板在浅色主题下变成黑块：面板引用的是三个**引擎里并不存在**的主题变量名（`--dsw-alias-bg-secondary` / `bg-tertiary` / `border`），取不到值就回落到写死的深色，于是浅色界面里出现黑底卡片和几乎看不清的日志区。现在改用引擎真实存在的变量（`--dsw-alias-bg-layer-1/2`、`--dsw-alias-border-l2`），并且所有兜底色改成与主题无关的半透明灰——任何主题下都不会再盖出黑块
            - 实测对比（同一台机器、同一个浅色界面、同一段面板）：修复前设置面板里有 14 处比页面暗很多的表面（日志区 `#0f1218`、按钮 `#1b1f2a`），修复后为 0
            - 修正下方安装包表格里标反的两行：`-win.exe` 是**便携版**（自解压运行，`/S` 静默安装不生效），`-win-x64.exe` / `-win-arm64.exe` 才是**安装器**

            **0.4.0 → 0.5.0**
            - 新增随安装包内置的**桌面面板插件**（`@dsh-desktop/dsh-desktop-panel`）：它走官方插件机制进引擎 profile，在 dsh 设置里多出一个「桌面端」页，显示外壳与引擎版本、日志目录、托盘与市场是否可用，可看外壳/引擎日志尾巴、一键导出诊断包、复制关键路径
            - 面板里可以直接**启停插件**（profile 依赖插件 + 随桌面端分发的插件分两组列出）。写的是引擎自己的配置层，**引擎约 1 秒内即时重载，不用重启**；面板不会给自己开关——停用自己会让这个开关一起消失，那种情况请在桌面端的插件市场里操作
            - 面板**经官方槽位机制注入界面**（不是 fork、不是覆盖、不是改引擎源码），和社区插件走完全相同的组合路径；客户端半边是手写的加载器模块，只用宿主注入的 react，不额外打包依赖
            - 客户端半边会把「注册到哪个槽位、成功还是失败」写成回执（`logs/desktop-panel-client.json`），界面没出来时诊断包里直接能看到是哪一步没成

            **0.3.0 → 0.4.0**
            - 新增**插件市场**：浏览 1024Store 目录（13000+ 条目、11 个分类）与自定义源，一键安装 / 启停 / 卸载
            - 安装只走官方 CLI（`dsh plugin --profile web add <包名>`），市场不会执行第三方提供的命令文本，只会安装它自己解析校验过的 npm 包；启停写引擎自己的配置层，与面板共用同一个区块
            - 搜索 / 详情 / 分页 / 已安装清单 / 源管理（可加自定义 HTTPS 源），无网时市场窗口仍可打开，方便卸载把引擎装坏的插件

            **0.2.6 → 0.3.0**
            - 新增**系统托盘**：关窗口不再顺手把引擎带走（可在设置里选择关窗口就退出），托盘菜单含打开界面、插件市场、诊断与退出
            - 新增**外壳多语言**：跟随系统，中文之外一律英文（此前界面写死中文）
            - 新增**诊断包导出**：一键打包日志、设置、引擎版本、系统信息（密钥自动打码），也可用 `DeepSeek --export-diagnostics` 无界面导出
            - 新增**引擎看护**：异常退出自动按 1s / 2s / 4s 退避重启；10 分钟内连续 3 次失败则打开恢复界面，可重启 / 回退到上一个可用引擎 / 重装 / 打开日志或导出诊断包
            - 新增**日志文件**（1 MB 自动轮转）与**固定端口**选项（`webPort`，默认随机，填了就用固定端口，方便依赖 localStorage 的界面插件）

            **0.2.5 → 0.2.6**
            - 修复 0.2.5 的模型同步写坏引擎配置：0.2.5 把引擎模型条目不支持的 `api`/`baseURL` 字段写进了 `llm-pi-ai`，导致整个模型配置被引擎拒绝——新模型不显示、设置里也添加不了新的模型提供商。0.2.6 改为完全不改动已有提供商：网关新模型写入伴生路由 `<提供商>-sync`（与引擎设置界面「添加提供方」完全相同的结构，共享同一把密钥），原提供商继续按引擎内置目录服务；曾装过 0.2.5 的机器启动时会自动清理坏字段并迁移到伴生路由
            - 已用引擎自身的配置校验器验证：同步后全部路由通过校验，模拟「添加提供方」操作不再被拒，引擎正常启动

            **0.2.4 → 0.2.5**
            - 修好模型列表同步（此前从未生效）：同步读取的配置结构与引擎实际使用的不一致、请求的接口路径也不对。现在按引擎真实结构（llm-pi-ai.providers）工作，启动时在引擎启动前自动拉取各接口的实时模型列表（Anthropic 风格 `/v1/models` 优先、OpenAI 风格 `/models` 兜底、两种鉴权自适应），与引擎内置模型目录合并：目录已有的模型保留引擎默认元数据（价格 / 上下文窗口 / 协议），新模型自动补齐协议与接口地址；只增不删，手工配置的模型不受影响
            - 设置页「模型与接口」改为真实读取引擎配置，不再显示内置演示假数据；手动同步完成后提示重启生效

            **0.2.3 → 0.2.4**
            - 修好引擎启动报 `ERR_MODULE_NOT_FOUND`：dsh 运行时要交叉引用约 100 个 `@deepseek-ai/*` 包，它们互相只声明为 peer 依赖，`--legacy-peer-deps` 安装会漏掉其中未被普通依赖覆盖的部分（0.2.1 装的引擎缺 19 个，0.2.2/0.2.3 的全新安装同样缺）。现在安装后与每次启动前都会扫描依赖树、按引擎版本锁定自动补齐缺失的 peer，旧引擎无需手动删除重装
            - 开发机 `npm install` 后自动校验并修复 Electron 二进制：Node 24 上 electron 自带的解压链会静默卡死、留下不完整的安装，现在 postinstall 会检测并用系统工具从本地缓存还原

            **0.2.0 → 0.2.1**
            - 修复官方引擎 Harness 更新拉取卡住问题：npm 安装添加 `--legacy-peer-deps`，跳过 70+ 个互锁预发布子包的 peer 依赖深度组合回溯，解决更新时 CPU/内存暴涨与下载超时问题

            **0.1.19 → 0.2.0**
            - 新增「视觉辅助模型」：主模型不支持识图时，先把图片交给 OpenAI 兼容的视觉模型（Qwen-VL / GLM-4V / gpt-4o / Ollama 等）转成文字描述；主模型支持识图时原图直通，识别能力由引擎自动判断。引擎设置里填接口地址、Key、模型名即可
            - 新增「自定义联网搜索」：web_search 工具可切换为 Tavily（自己的 API Key，模型看到的工具与结果卡片不变），也可一键切回 DeepSeek 官方搜索
            - 两个功能都以随安装包内置的官方机制引擎插件实现（ctx.web provider 注册 + agent/pre-step 改写），不改引擎源码；API Key 只存本机、经环境变量传给引擎，不落明文配置
            - 已通过真实引擎启动冒烟验证插件加载链路；测试套件扩至 121 例

            **0.1.18 → 0.1.19**
