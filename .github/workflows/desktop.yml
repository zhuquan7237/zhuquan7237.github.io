name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.7
          name: DeepSeek Desktop 0.1.7
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            请用 0.1.7。这一版修了 Windows 上 `spawn EINVAL` 之后安装引擎卡住的问题。

            **0.1.6 → 0.1.7**
            - Windows 不再直接 spawn `npm.cmd`（会抛 EINVAL 并卡死）。改为用官方 zip 里的 `node_modules/npm/bin/npm-cli.js`，由 node.exe 运行
            - 过滤掉环境变量里的空值，子进程 stdin 不再挂起
            - 安装引擎时会持续打日志，不再看起来像死机
            - 弹窗改回系统原生对话框（Windows 11 / macOS / 各 Linux 桌面自己的边框）

            **直接下载（不用登录）**
            - Windows 安装包：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.7/DeepSeek-0.1.7-win.exe
            - Linux x64（推荐 tar.gz）：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.7/DeepSeek-0.1.7-linux-x64.tar.gz
            - Linux x64 deb：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.7/DeepSeek-0.1.7-linux-amd64.deb
            - macOS Apple Silicon：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.7/DeepSeek-0.1.7-mac-arm64.dmg
            - macOS Intel：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.7/DeepSeek-0.1.7-mac-x64.dmg

            首次启动需要联网 1–3 分钟（下载 Node 和官方 dsh）。之后用菜单 **Harness → 检查 Harness 更新**。

            **Linux:** 优先 `.tar.gz` 或 `.deb`。AppImage 在 Ubuntu 24.04 常缺 libfuse2。便携版第一次打开会自动放桌面图标。
            **Windows:** 安装包会创建桌面和开始菜单快捷方式。未签名时 SmartScreen 选「更多信息 → 仍要运行」。
            **macOS:** 把 App 拖到「应用程序」。未签名请右键 → 打开。

            | File | Platform |
            | --- | --- |
            | `DeepSeek-0.1.7-win.exe` | Windows installer |
            | `DeepSeek-0.1.7-win-x64.exe` / `*-win-arm64.exe` | Windows portable |
            | `DeepSeek-0.1.7-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-0.1.7-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-0.1.7-linux-x64.tar.gz` / `*-linux-amd64.deb` | Linux x64 |
            | `DeepSeek-0.1.7-linux-arm64.tar.gz` / `*-linux-arm64.deb` | Linux arm64 |
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.tar.gz
