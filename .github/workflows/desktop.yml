name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.sh
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # dl/latest.json must always be committed on main, even when the build
          # was triggered from a cursor/** branch.
          ref: main
      - name: Read desktop version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # GitHub 平台对「更新已存在的 release」（update-a-release 端点）用 GITHUB_TOKEN
      # 会 403 Resource not accessible by integration（2025-01 起多个仓库复现的已知问题；
      # 新建 release 不受影响）。因此同版本重复推送时不再尝试重新发布——直接跳过，
      # 需要刷新资产就手动：gh release upload desktop-vX.Y.Z <file> --clobber
      - name: Skip publish when this version is already released
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "desktop-v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "desktop-v$V 已发布过——本次仅构建检验，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish public GitHub Release
        if: steps.released.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: DeepSeek Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
      # body 会随版本增长，GitHub 对这里的表达式有 21000 字符上限；超过后整个
      # workflow 会被拒绝启动（报 Exceeded max expression length，run 里一个 job
      # 都不会出现）。只保留最近两版说明 + 下载信息，更早的说明留在各自 Release 里。
          body: |
            请用 ${{ steps.version.outputs.version }}。不要用更早的版本。

            **0.8.0 → 0.8.1**
            - **手机端能看到官方 DeepSeek 模型**：桥接原来只读 `llm-pi-ai` 里手写的提供商，把引擎自己管理的官方提供商（账号登录 `deepseek-account`、官方 API key `deepseek-official`，以及其它插件注册的路由）全部漏掉——官方登录后手机模型列表里一个 DeepSeek 都没有。现在 `/mobile/models` 会把这些模型一起列出，手机可直接选来切模型或开新会话。
            - **只读保护**：官方提供商在手机端标为「只读」，不显示编辑 / 删除 / 停用；写路径只碰手写提供商，任何试图把官方模型写回配置的提交都会被丢弃，不会破坏引擎设置。
            - **思考强度**：官方模型显示「关 / 低 / 高 / Max」，默认档位跟随引擎给的默认值，不再把第一档当默认。
            - 本次改内置 mobile-bridge 插件（0.2.45）；建议手机 App 更新到 0.6.3 获得只读标记。

            **0.7.9 → 0.8.0**
            - **手机配对地址换成稳定入口**：二维码/链接固定给 `nav-cn.zhuquan.xyz`（Cloudflare 隧道，进同一台中继）。此前给 `cn.zhuquan.xyz:8443` 直连，部分手机（实测小米 Turbo 3 / Android 15）在 TCP 建连后、TLS 开始前就被本机掐断，App 只能回退 `relay.zhuquan.xyz`——那正是它判定的「旧线路」，于是每次启动都提示「建议重新配对」。换入口后提示不再出现。
            - **直连入口保留可用**：中继继续在 8443 监听，并新增 443（同一张证书）；实测 h1/h2 均 34–67ms，需要直连时可随时切回，旧版客户端完全兼容。
            - **中继可观测性**：每个请求日志追加 `via=direct` / `via=cf:<客户端IP>`，一条日志即可判断手机走的是直连还是 Cloudflare。
            - 本次只改内置 mobile-bridge 插件（0.2.44），手机 App 无需更新。

            **0.7.8 → 0.7.9**
            - **跨端视觉统一**：Android 手机端 0.6.1 改为冷灰与蓝色体系，支持系统深浅主题；首页增加继续会话、状态筛选和清晰的信息层级，代码与表格只展示简短内容提示。
            - **手机配对页重设计**：二维码与两步扫码说明并排，手动码和倒计时明确；地址可折叠、设备可搜索，刷新不会覆盖未保存的地址。
            - **中继稳定性**：过滤 HTTP/2 伪头，坏帧只让当前请求失败，避免异常使引擎退出；连接尝试重置线路稳定时间并记录断线原因。
            - **减少重复请求**：Android 和桥接共享同一份在途列表请求；新建会话会开启新的缓存世代，旧请求不会覆盖新列表。
            - **兼容性**：接口协议保持兼容，建议桌面 0.7.9 与手机 0.6.1 一起升级。

            **0.7.7 → 0.7.8**
            - 修复跨会话历史、发送回执、停止与断线恢复竞态，按电脑连接隔离草稿和未确认提交。
            - 回答在完成后显示，区分等待与模型实际响应；改善中文 Markdown 列表和表格。

          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.rpm
            installers/*.tar.gz
            installers/*.sh
      # softprops has finished every asset upload by this point, so the manifest
      # cannot race half-uploaded assets the way a separate "release published"
      # workflow did (0.1.18 shipped a latest.json with 7 of 17 assets, size 0).
      - name: Write dl/latest.json from the published release
        if: github.ref == 'refs/heads/main' && steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          version = os.environ["VERSION"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/zhuquan7237/zhuquan7237.github.io/releases/tags/desktop-v{version}"],
              text=True,
          )
          rel = json.loads(raw)
          assets = []
          for asset in rel.get("assets") or []:
              name = asset.get("name") or ""
              if not name.startswith("DeepSeek-"):
                  continue
              assets.append({
                  "name": name,
                  "url": f"https://dsh.zhuquan.xyz/dl/{name}",
                  "github": asset.get("browser_download_url"),
                  "size": int(asset.get("size") or 0),
              })
          payload = {
              "version": version,
              "tag": rel.get("tag_name") or f"desktop-v{version}",
              "htmlUrl": "https://dsh.zhuquan.xyz/dl/",
              "notes": (rel.get("body") or "").strip().split("\n", 1)[0],
              "assets": assets,
          }
          os.makedirs("dl", exist_ok=True)
          with open("dl/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(version, len(assets), "assets")
          PY
      - name: Commit dl/latest.json
        if: github.ref == 'refs/heads/main' && steps.released.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add dl/latest.json
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dl/latest.json for desktop v${VERSION}."
          git push origin HEAD:main
