name: Desktop installers

on:
  push:
    branches: [main, cursor/deepseek-codex-app-f4c3]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.1
          name: DeepSeek Desktop 0.1.1
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            Codex-style desktop shell. The engine is official `@deepseek-ai/dsh` and updates from npm independently.

            First launch needs internet: the app downloads Node (if needed) and `@deepseek-ai/dsh`. After that, open **Harness → 检查 Harness 更新** to upgrade the engine without reinstalling the desktop app.

            **Linux:** prefer `.tar.gz` or `.deb`. AppImage needs libfuse2 (often missing on Ubuntu 24.04). Unpack tar.gz and run `./DeepSeek`.
            **Windows:** SmartScreen may warn because the build is unsigned — choose More info → Run anyway.
            **macOS:** unsigned — right-click the app → Open.

            | File | Platform |
            | --- | --- |
            | `DeepSeek-*-win.exe` | Windows installer (x64 + arm64) |
            | `DeepSeek-*-win-x64.exe` / `*-win-arm64.exe` | Windows portable |
            | `DeepSeek-*-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-*-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-*-linux-x64.tar.gz` / `*-linux-amd64.deb` | Linux x64 |
            | `DeepSeek-*-linux-arm64.tar.gz` / `*-linux-arm64.deb` | Linux arm64 |
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.rpm
            installers/*.tar.gz
