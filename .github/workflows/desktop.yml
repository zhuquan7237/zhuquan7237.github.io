name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/run-generate-icon.cjs
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.tar.gz
            desktop/release/*.sh
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # dl/latest.json must always be committed on main, even when the build
          # was triggered from a cursor/** branch.
          ref: main
      - name: Read desktop version
        id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: DeepSeek Desktop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
      # body 会随版本增长，GitHub 对这里的表达式有 21000 字符上限；超过后整个
      # workflow 会被拒绝启动（报 Exceeded max expression length，run 里一个 job
      # 都不会出现）。只保留最近两版说明 + 下载信息，更早的说明留在各自 Release 里。
          body: |
            请用 ${{ steps.version.outputs.version }}。不要用更早的版本。

            **0.5.26 → 0.5.28**
            - **模型网络路由：每个提供商可选「代理 / 直连」**。有的提供商必须走代理才能用、有的必须直连——现在在电脑端「设置 → 手机配对」页的「模型网络」卡片里逐家选择「自动（走代理）/ 代理 / 直连」，然后点「保存并重启电脑端」生效（引擎的出站代理只认启动环境，所以改动通过自动重启生效）
            - 引擎启动环境自动注入：桌面壳按上述配置合成 HTTP(S)_PROXY / NO_PROXY（代理地址默认 http://127.0.0.1:7897，可改）；loopback 永远直连
            - 收到重启请求后电脑端自动重启引擎（数秒），手机端稍等自动重连
            - 桌面端版本 0.5.28；桥接插件 0.2.20

            **0.5.25 → 0.5.26**
            - **手机端新增「从上游同步模型」**：模型提供方上游的清单会变——现在在手机端每家提供商里点一下就能拉回最新清单，新增的模型勾选即加（加完自动补能力）。配套手机端 0.2.46
            - **修复：手机端保存模型时可能丢掉电脑端新加的模型**。当手机端的快照过期（电脑端又改过配置）时，旧实现会用手机列表整表覆盖。现在改为三方合并：只并入手机明确改过的部分，电脑端的新增与改动一律保留；并且每次写配置前自动留一份 settings.yaml 快照（dsh-home/backups，存最近 30 份，可人工回滚）
            - **手机端错误日志分级整理**：对话失败（上游模型问题）不再进日志；剩下的日志按天分组、通俗标题（技术细节点开看）、可多选删除或一键清空
            - 桌面端版本 0.5.26；桥接插件 0.2.19

            **0.5.22 → 0.5.23**
            - **生成的文件按会话归属**：同一个工作目录被很多会话共用时，以前每个会话都显示同一堆文件（新写的也会串进老会话）。现在按「回合时间窗」记账——只有这个会话的回合里改动过的文件才算它生成的；历史会话首次查看时按其自身历史回填。手机端只会看到本会话的文件，没生成过文件的会话不再显示入口（配套手机端 0.2.41）
            - **文件预览更流畅**：文件响应带 ETag / Last-Modified，重开只做一次 304 校验、不再整包重传；WebView 的子资源（如 three.min.js）第二次打开走校验缓存——经云端中继时差别最明显
            - **回合因输出上限被截断时不再「像卡死」**：桥接通知与手机端都会说明「输出达到长度上限、这一回合没能写完」，并给出「继续」的出路；此前这种回合只是安静地结束，在手机上看起来和卡死一模一样（皮卡丘那次就是：模型思考 150 秒撞上上限，一个字都没写出来）
            - 桌面端版本 0.5.23；桥接插件 0.2.15

            **直接下载（不用登录）**
            - Windows 安装包：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-win.exe
            - Linux x64（推荐 tar.gz）：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            - Linux x64 deb：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-amd64.deb
            - Linux x64 rpm：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-x86_64.rpm
            - Linux arm64 tar.gz：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            - Linux arm64 deb：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.deb
            - Linux arm64 rpm：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-linux-aarch64.rpm
            - macOS Apple Silicon：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-mac-arm64.dmg
            - macOS Intel：https://dsh.zhuquan.xyz/dl/DeepSeek-${{ steps.version.outputs.version }}-mac-x64.dmg

            首次启动需要联网 1–3 分钟（下载 Node 和官方 dsh）。默认皮肤已内置。之后菜单可检查桌面版和 Harness 更新。

            **Linux:** 优先 `.tar.gz` 或 `.deb`。AppImage 在 Ubuntu 24.04 常缺 libfuse2。
            **Windows:** 安装包会创建桌面和开始菜单快捷方式。便携版快捷方式指向该 exe 本身，关掉后仍然有效。未签名时 SmartScreen 选「更多信息 → 仍要运行」。
            **macOS:** 把 App 拖到「应用程序」。若提示已损坏，终端运行 `xattr -cr /Applications/DeepSeek.app`。DMG 里有 `Read-Me-First.txt` 和 `Open-DeepSeek.command`。说明：https://dsh.zhuquan.xyz/mac.html

            | File | Platform |
            | --- | --- |
            | `DeepSeek-${{ steps.version.outputs.version }}-win.exe` | Windows portable（自解压运行，免安装；软件内更新用的就是它） |
            | `DeepSeek-${{ steps.version.outputs.version }}-win-x64.exe` / `*-win-arm64.exe` | Windows installer（NSIS 安装器，支持静默 `/S`） |
            | `DeepSeek-${{ steps.version.outputs.version }}-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-${{ steps.version.outputs.version }}-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-x64.tar.gz` / `*-linux-amd64.deb` / `*-linux-x86_64.rpm` | Linux x64 |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-arm64.tar.gz` / `*-linux-arm64.deb` / `*-linux-aarch64.rpm` | Linux arm64 |
            | `DeepSeek-${{ steps.version.outputs.version }}-linux-*.AppImage` / `*-no-fuse.sh` | AppImage（需 libfuse2，或用脚本） |

          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.rpm
            installers/*.tar.gz
            installers/*.sh
      # softprops has finished every asset upload by this point, so the manifest
      # cannot race half-uploaded assets the way a separate "release published"
      # workflow did (0.1.18 shipped a latest.json with 7 of 17 assets, size 0).
      - name: Write dl/latest.json from the published release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          version = os.environ["VERSION"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/zhuquan7237/zhuquan7237.github.io/releases/tags/desktop-v{version}"],
              text=True,
          )
          rel = json.loads(raw)
          assets = []
          for asset in rel.get("assets") or []:
              name = asset.get("name") or ""
              if not name.startswith("DeepSeek-"):
                  continue
              assets.append({
                  "name": name,
                  "url": f"https://dsh.zhuquan.xyz/dl/{name}",
                  "github": asset.get("browser_download_url"),
                  "size": int(asset.get("size") or 0),
              })
          payload = {
              "version": version,
              "tag": rel.get("tag_name") or f"desktop-v{version}",
              "htmlUrl": "https://dsh.zhuquan.xyz/dl/",
              "notes": (rel.get("body") or "").strip().split("\n", 1)[0],
              "assets": assets,
          }
          os.makedirs("dl", exist_ok=True)
          with open("dl/latest.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(version, len(assets), "assets")
          PY
      - name: Commit dl/latest.json
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add dl/latest.json
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dl/latest.json for desktop v${VERSION}."
          git push origin HEAD:main
