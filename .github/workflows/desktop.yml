name: Desktop installers

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - run: npm test
      - run: npm run build

  pack:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python3 scripts/generate-icon.py
      - run: npm install
      - name: Pack
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD || true
          npm run ${{ matrix.script }}
      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-mac-signature.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz
          if-no-files-found: warn

  publish-release:
    needs: pack
    if: github.event_name != 'pull_request' && !cancelled() && needs.pack.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.13
          name: DeepSeek Desktop 0.1.13
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            请用 0.1.13。不要用 0.1.0–0.1.12。

            **0.1.12 → 0.1.13**
            - 修好便携版 / AppImage 首次打开后桌面快捷方式指向临时解压目录，关掉软件后失效。快捷方式改为指向便携版 exe / AppImage 本身；旧的失效快捷方式下次从安装包打开会自动修好

            **0.1.11 → 0.1.12**
            - 默认皮肤「深海女仆工坊」打进安装包，不再从 GitHub 下载（国内网络拉不下皮肤时也能用）
            - 升级后尽量继承旧版 API 密钥和引擎配置：当前 `%AppData%\DeepSeek` / `~/.config/DeepSeek`，以及更早的 `深度求索`、`DeepSeek Harness`、官方 `~/.dsh`

            **0.1.10 → 0.1.11**
            - 修好从旧版「检查桌面版更新」升到 0.1.10 后 dsh 退出：`cordis.patch.yml` 必须是顶层 YAML 数组，空补丁写 `[]`，启动时自动修复坏文件

            **0.1.9 → 0.1.10**
            - 对话窗口右上角皮肤中心：圆形按钮弹出皮肤列表，可快速切换，也可导入新皮肤
            - 默认皮肤是 [Small-tailqwq/dsh-deep-whale](https://github.com/Small-tailqwq/dsh-deep-whale) 的「深海女仆工坊」，CC BY-NC-SA 4.0，禁止商用。署名链：上善 → ZipZipPipe → Small-tailqwq
            - 可在引擎设置里关闭皮肤中心，恢复官方界面

            **0.1.8 → 0.1.9**
            - macOS ad-hoc 签名 + `Open-DeepSeek.command`
            - 桌面版会查 GitHub Release 更新

            **直接下载（不用登录）**
            - Windows 安装包：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.13/DeepSeek-0.1.13-win.exe
            - Linux x64（推荐 tar.gz）：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.13/DeepSeek-0.1.13-linux-x64.tar.gz
            - Linux x64 deb：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.13/DeepSeek-0.1.13-linux-amd64.deb
            - macOS Apple Silicon：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.13/DeepSeek-0.1.13-mac-arm64.dmg
            - macOS Intel：https://github.com/zhuquan7237/zhuquan7237.github.io/releases/download/desktop-v0.1.13/DeepSeek-0.1.13-mac-x64.dmg

            首次启动需要联网 1–3 分钟（下载 Node 和官方 dsh）。默认皮肤已内置。之后菜单可检查桌面版和 Harness 更新。

            **Linux:** 优先 `.tar.gz` 或 `.deb`。AppImage 在 Ubuntu 24.04 常缺 libfuse2。
            **Windows:** 安装包会创建桌面和开始菜单快捷方式。便携版快捷方式指向该 exe 本身，关掉后仍然有效。未签名时 SmartScreen 选「更多信息 → 仍要运行」。
            **macOS:** 把 App 拖到「应用程序」。若提示已损坏，终端运行 `xattr -cr /Applications/DeepSeek.app`。DMG 里有 `Read-Me-First.txt` 和 `Open-DeepSeek.command`。说明：https://dsh.zhuquan.xyz/mac.html

            | File | Platform |
            | --- | --- |
            | `DeepSeek-0.1.13-win.exe` | Windows installer |
            | `DeepSeek-0.1.13-win-x64.exe` / `*-win-arm64.exe` | Windows portable |
            | `DeepSeek-0.1.13-mac-arm64.dmg` | macOS Apple Silicon |
            | `DeepSeek-0.1.13-mac-x64.dmg` | macOS Intel |
            | `DeepSeek-0.1.13-linux-x64.tar.gz` / `*-linux-amd64.deb` | Linux x64 |
            | `DeepSeek-0.1.13-linux-arm64.tar.gz` / `*-linux-arm64.deb` | Linux arm64 |
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.zip
            installers/*.AppImage
            installers/*.deb
            installers/*.tar.gz
