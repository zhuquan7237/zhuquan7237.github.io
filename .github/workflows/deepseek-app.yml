name: Build DeepSeek App

on:
  push:
    branches: [main, cursor/deepseek-codex-app-f4c3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepseek-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deepseek-app/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
