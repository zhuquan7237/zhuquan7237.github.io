<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhu Quan · 材料科学与工程</title>
    <style>
        :root {
            --c-from: #667eea;
            --c-to: #764ba2;
            --c-deep: #4c3a8a;
            --c-ink: #1c1630;
            --c-body: #4a4458;
            --c-muted: #7a7488;
            --c-line: #e8e4f0;
            --c-paper: #f6f4fb;
            --c-card: #ffffff;
            --shadow: 0 10px 30px rgba(102, 126, 234, 0.12);
            --shadow-hover: 0 18px 44px rgba(102, 126, 234, 0.22);
            --radius: 20px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            font-weight: 400;
            font-size: 16px;
            line-height: 1.75;
            color: var(--c-body);
            background: var(--c-paper);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        /* —— Header —— */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(246, 244, 251, 0.72);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid transparent;
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .site-header.is-scrolled {
            background: rgba(255, 255, 255, 0.92);
            border-bottom-color: var(--c-line);
            box-shadow: 0 4px 18px rgba(76, 58, 138, 0.06);
        }

        .brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.02em;
            color: var(--c-ink);
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav a {
            font-size: 14px;
            font-weight: 500;
            color: var(--c-muted);
            padding: 6px 12px;
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .nav a:hover,
        .nav a:focus-visible {
            color: var(--c-to);
            background: rgba(118, 75, 162, 0.08);
        }

        /* —— Hero —— */
        .hero {
            position: relative;
            overflow: hidden;
            margin: 16px 16px 0;
            padding: 72px 40px 80px;
            border-radius: 28px;
            color: #fff;
            background: linear-gradient(135deg, var(--c-from) 0%, var(--c-to) 100%);
            box-shadow: 0 24px 60px rgba(102, 126, 234, 0.28);
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::before {
            width: 420px;
            height: 420px;
            right: -120px;
            top: -160px;
            background: rgba(255, 255, 255, 0.12);
        }

        .hero::after {
            width: 280px;
            height: 280px;
            left: -80px;
            bottom: -120px;
            background: rgba(0, 0, 0, 0.08);
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            max-width: 760px;
        }

        .hero-kicker {
            display: inline-block;
            margin-bottom: 18px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 16px;
        }

        .hero .lead {
            font-size: clamp(16px, 2.2vw, 18px);
            font-weight: 400;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.88);
            max-width: 36em;
        }

        /* —— Layout —— */
        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 56px 24px 24px;
        }

        section + section {
            margin-top: 56px;
        }

        .section-head {
            margin-bottom: 24px;
        }

        .section-head h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--c-ink);
            line-height: 1.4;
        }

        .section-head p {
            margin-top: 6px;
            color: var(--c-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* —— Research —— */
        .research-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .research-list li {
            background: var(--c-card);
            border: 1px solid var(--c-line);
            border-radius: var(--radius);
            padding: 24px 22px 22px;
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .research-list li:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .research-index {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            margin-bottom: 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--c-from), var(--c-to));
        }

        .research-list h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--c-ink);
            line-height: 1.65;
        }

        /* —— Projects —— */
        .project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .project-card {
            display: block;
            background: var(--c-card);
            border: 1px solid var(--c-line);
            border-radius: var(--radius);
            padding: 28px 26px;
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover,
        .project-card:focus-visible {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .project-badge {
            display: inline-block;
            margin-bottom: 12px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--c-to);
            background: rgba(118, 75, 162, 0.1);
            border-radius: 999px;
        }

        .project-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--c-ink);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .project-card p {
            font-size: 15px;
            line-height: 1.75;
            color: var(--c-body);
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--c-from);
        }

        .project-card:hover .project-link {
            color: var(--c-to);
        }

        /* —— Footer —— */
        .site-footer {
            margin-top: 64px;
            padding: 28px 24px 36px;
            text-align: center;
            color: rgba(255, 255, 255, 0.82);
            background: linear-gradient(135deg, var(--c-from) 0%, var(--c-deep) 100%);
        }

        .site-footer a {
            font-weight: 600;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.45);
            transition: border-color 0.2s ease;
        }

        .site-footer a:hover,
        .site-footer a:focus-visible {
            border-bottom-color: #fff;
        }

        .site-footer p {
            font-size: 14px;
            line-height: 1.7;
        }

        .site-footer .copy {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.62);
        }

        @media (max-width: 800px) {
            .research-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 375px) {
            .site-header {
                padding: 12px 16px;
            }

            .hero {
                margin: 12px 12px 0;
                padding: 48px 20px 56px;
                border-radius: 20px;
            }

            .wrap {
                padding: 40px 16px 16px;
            }

            section + section {
                margin-top: 40px;
            }

            .research-list,
            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader">
        <a class="brand" href="#top">Zhu Quan</a>
        <nav class="nav" aria-label="页面导航">
            <a href="#research">研究方向</a>
            <a href="#projects">项目</a>
            <a href="#contact">联系</a>
        </nav>
    </header>

    <main id="top">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-inner">
                <span class="hero-kicker">个人主页</span>
                <h1 id="hero-title">Zhu Quan · 材料科学与工程</h1>
                <p class="lead">材料科学与工程专业本科生，研究方向为异种不锈钢激光焊接工艺优化</p>
            </div>
        </section>

        <div class="wrap">
            <section id="research" aria-labelledby="research-title">
                <div class="section-head">
                    <h2 id="research-title">研究方向</h2>
                    <p>围绕激光焊接过程中的工艺、温度场与组织性能展开。</p>
                </div>
                <ul class="research-list">
                    <li>
                        <span class="research-index" aria-hidden="true">01</span>
                        <h3>异种不锈钢激光焊接工艺优化</h3>
                    </li>
                    <li>
                        <span class="research-index" aria-hidden="true">02</span>
                        <h3>焊接温度场数值模拟</h3>
                    </li>
                    <li>
                        <span class="research-index" aria-hidden="true">03</span>
                        <h3>金相组织分析与性能表征</h3>
                    </li>
                </ul>
            </section>

            <section id="projects" aria-labelledby="projects-title">
                <div class="section-head">
                    <h2 id="projects-title">项目</h2>
                    <p>课余时间完成的小工具，可在本站直接使用。</p>
                </div>
                <div class="project-grid">
                    <a class="project-card" href="pomodoro.html">
                        <span class="project-badge">Web 应用</span>
                        <h3>番茄闹钟</h3>
                        <p>可自定义番茄 / 休息时长的计时工具。</p>
                        <span class="project-link">打开项目 →</span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer" id="contact">
        <p>GitHub：<a href="https://github.com/zhuquan7237" rel="noopener noreferrer">github.com/zhuquan7237</a></p>
        <p class="copy" id="yearLine">Zhu Quan</p>
    </footer>

    <script>
        (function () {
            var header = document.getElementById("siteHeader");
            var yearLine = document.getElementById("yearLine");

            function onScroll() {
                header.classList.toggle("is-scrolled", window.scrollY > 8);
            }

            window.addEventListener("scroll", onScroll, { passive: true });
            onScroll();

            yearLine.textContent = "Zhu Quan · " + new Date().getFullYear();
        })();
    </script>
</body>
</html>
